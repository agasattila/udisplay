# .github/workflows/build-framework.yml
#
# Packages the uDisplay framework (libudisplay, udisplay-gen, demos as
# sources) from the build tree of ci.yml's desktop build-all job: the CMake
# install rules of the `framework` component stage udisplay-framework-<version>/
# (version baked in at configure time), which is archived as
# udisplay-framework-<version>.tar.gz. Nothing is compiled, so no Qt is needed.
#
# The archive has the same content as `cpack --config build/CPackConfig.cmake`,
# but cpack first runs the `preinstall` target, which re-checks the build
# system against the fresh checkout and recompiles; `cmake --install` doesn't.

name: Framework package

on:
  workflow_call:
    inputs:
      version-full:
        description: Display version the build tree was configured with (UDISPLAY_VERSION_FULL)
        type: string
        required: true

permissions:
  contents: read

jobs:
  framework:
    name: Package framework
    runs-on: ubuntu-24.04

    steps:
      # The install rules copy sources straight from the checkout.
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-build

      - name: Extract build tree
        run: tar -xzf desktop-build.tar.gz && rm desktop-build.tar.gz

      - name: Install framework tree
        run: |
          cmake \
            --install build \
            --component framework \
            --prefix "stage/udisplay-framework-${{ inputs.version-full }}"

      - name: Create archive
        run: |
          tar \
            -C stage \
            --owner=0 --group=0 --numeric-owner \
            -czf "udisplay-framework-${{ inputs.version-full }}.tar.gz" \
            "udisplay-framework-${{ inputs.version-full }}"

      - name: Upload framework artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: udisplay-framework-${{ inputs.version-full }}
          path: udisplay-framework-${{ inputs.version-full }}.tar.gz
          if-no-files-found: error
          retention-days: 30
