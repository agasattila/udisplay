# .github/workflows/build-framework.yml
#
# Packages the uDisplay framework (libudisplay, udisplay-gen, demos as
# sources) from the build tree of ci.yml's desktop build-all job. CPack runs
# the CMake install rules of the `framework` component into a staging tree
# and archives it as udisplay-framework-<version>.tar.gz; the version is
# baked in at configure time. Nothing is compiled, so no Qt is needed.

name: Framework package

on:
  workflow_call:
    inputs:
      version-full:
        description: Display version the build tree was configured with (UDISPLAY_VERSION_FULL)
        type: string
        required: true

permissions:
  contents: read

jobs:
  framework:
    name: Package framework
    runs-on: ubuntu-24.04

    steps:
      # The install rules copy sources straight from the checkout.
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build tree
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-build

      - name: Extract build tree
        run: tar -xzf desktop-build.tar.gz && rm desktop-build.tar.gz

      - name: Package
        run: cpack --config build/CPackConfig.cmake

      - name: Upload framework artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: udisplay-framework-${{ inputs.version-full }}
          path: build/package/udisplay-framework-${{ inputs.version-full }}.tar.gz
          if-no-files-found: error
          retention-days: 30
