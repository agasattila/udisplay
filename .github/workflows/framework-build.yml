# .github/workflows/framework-build.yml
#
# Thin wrapper around the top-level CMakeLists.txt: every build, test and
# packaging rule lives there, so this reproduces locally with the same
# configure / build / ctest / cpack commands (see docs/building.md).
#
# The Qt client keeps its own workflow (udisplay-client-build.yml) for the
# AppImage/APK pipeline; here it's switched off so this job needs no Qt.

name: Build uDisplay framework

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Tag vX.Y.Z[-suffix] -> X.Y.Z (+ suffix in the display version);
      # anything else -> 0.0.0-<short sha>, so branch artifacts are never
      # mistaken for releases.
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)(-[A-Za-z0-9.]+)?$ ]]; then
            version="${BASH_REMATCH[1]}"
            full="${version}${BASH_REMATCH[2]}"
          else
            version="0.0.0"
            full="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "full=${full}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 python3-venv

      - name: Install udisplay-gen dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e "./udisplay-gen[dev]"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="${{ github.workspace }}/.venv/bin/python" \
            -DUDISPLAY_BUILD_CLIENT=OFF \
            -DUDISPLAY_VERSION="${{ steps.version.outputs.version }}" \
            -DUDISPLAY_VERSION_FULL="${{ steps.version.outputs.full }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake

      - name: Upload framework artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: udisplay-framework-${{ steps.version.outputs.full }}
          path: build/package/udisplay-framework-${{ steps.version.outputs.full }}.tar.gz
          if-no-files-found: error
          retention-days: 30
